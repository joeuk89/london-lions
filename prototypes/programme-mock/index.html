<!doctype html>
<!--
PROTOTYPE. Throwaway mock for wayfinder ticket #9: what does a programme look and read like?
Three variants of one programme (London Lions v Bristol Flyers, Sat 24 Oct 2026), switchable
with ?variant=A|B|C and the floating bar. ?venue=changed shows the venue-change treatment.
Content is hand-written from public sources read on 22 Oct 2026; every section lists them.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lions v Flyers programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000;--paper:#fff;--gold:#C9A227;--gold-deep:#7A5C0B;--stone:#5C5A55;--rule:#E6E2D6;--wash:#F7F4EC;
  --serif:"Fraunces",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;font-variation-settings:"opsz" 12;print-color-adjust:exact;-webkit-print-color-adjust:exact}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.1}
p{margin:0 0 .8em}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:13px;line-height:1.3}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--stone)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.us td{background:var(--wash);font-weight:600}
.src{font-family:var(--sans);font-size:11.5px;color:var(--stone);line-height:1.35;margin:.6em 0 0}
.src a{color:var(--gold-deep);text-decoration:none;border-bottom:1px solid var(--rule)}
.form{font-family:var(--sans);font-weight:600;letter-spacing:.08em;font-size:14px}
.form .w{color:var(--gold-deep)}.form .l{color:var(--stone)}
.venue-flag{background:var(--gold);color:var(--ink);padding:10px 14px;font-family:var(--sans);font-size:14px;font-weight:600;line-height:1.35}
.venue-flag small{display:block;font-weight:400;margin-top:2px}
.demo{font-family:var(--sans);font-size:11px;color:var(--stone)}

/* ---------- Variant A: Programme ---------- */
.A .cover{background:var(--ink);color:var(--paper);min-height:100svh;padding:28px 20px;display:flex;flex-direction:column;justify-content:space-between}
.A .cover .date{color:var(--gold);font-family:var(--sans);font-size:15px;font-weight:500}
.A .cover .title{font-weight:300;font-variation-settings:"opsz" 144;font-size:clamp(44px,12vw,112px);line-height:.92;letter-spacing:-.02em;margin:auto 0 .2em}
.A .cover .title i{font-style:italic;color:var(--gold);font-weight:300}
.A .cover .title b{display:block;font-weight:700}
.A .cover .where{font-family:var(--sans);font-size:15px;line-height:1.4}
.A .cover .where strong{display:block;font-size:30px;font-family:var(--serif);font-weight:600;line-height:1}
.A .cover .venue-flag{margin:16px 0 0}
.A .body{max-width:38em;margin:0 auto;padding:12px 20px 60px}
.A section{padding:26px 0 8px;border-top:3px solid var(--ink)}
.A section+section{border-top-width:1px;border-top-color:var(--rule)}
.A h2{font-size:30px;font-variation-settings:"opsz" 72;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
.A h2 i{color:var(--gold-deep);font-weight:400}
.A h3{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--stone);margin:16px 0 6px}
.A .lede{font-size:19px;line-height:1.4;font-variation-settings:"opsz" 18}
.scores{font-family:var(--sans);font-size:14px;margin:0 0 10px;padding:0;list-style:none}
.scores li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--rule)}
.scores li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.A .players{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:0 0 6px}
.A .players div{font-size:14.5px;line-height:1.35}
.A .players b{display:block;font-size:17px}
.A .players small{font-family:var(--sans);color:var(--stone);font-size:12px}
.A .watch{list-style:none;padding:0;margin:0}
.A .watch li{padding:8px 0 8px 18px;position:relative}
.A .watch li::before{content:"";position:absolute;left:0;top:16px;width:9px;height:9px;background:var(--gold)}
.A .next{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-family:var(--sans);font-size:14px}
.A .next b{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Variant B: Briefing ---------- */
.B{font-family:var(--sans);font-size:14.5px}
.B .top{background:var(--ink);color:var(--paper);padding:14px 16px}
.B .top h1{font-family:var(--serif);font-weight:600;font-size:24px;font-variation-settings:"opsz" 48}
.B .top h1 span{color:var(--gold)}
.B .top p{margin:4px 0 0;color:#ddd;font-size:13.5px}
.B .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.B .facts div{background:var(--paper);padding:10px 14px}
.B .facts small{display:block;color:var(--stone);font-size:12px}
.B .facts strong{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1;display:block;margin-top:2px}
.B .facts em{font-style:normal;font-size:12.5px;color:var(--stone)}
.B .body{max-width:44em;margin:0 auto;padding:0 16px 60px}
.B section{padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.B h2{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.B h2 sup{font-weight:400;color:var(--gold-deep);font-size:11px}
.B p{font-size:14.5px;line-height:1.45;margin-bottom:.5em}
.B ul{margin:0 0 .5em;padding-left:18px}
.B li{margin:2px 0}
.B .two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.B .notes{padding:16px 0;font-size:12px;color:var(--stone);line-height:1.4}
.B .notes ol{padding-left:18px;margin:4px 0 0}
.B .venue-flag{font-size:13.5px}

/* ---------- Variant C: Head to head ---------- */
.C .hero{padding:16px 16px 0}
.C .hero .meta{font-family:var(--sans);font-size:14px;color:var(--stone);margin-bottom:6px}
.C .hero h1{font-size:clamp(34px,9vw,64px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.C .hero h1 i{font-weight:300;font-style:italic;color:var(--gold-deep)}
.C .compare{display:grid;grid-template-columns:1fr auto 1fr;gap:0 8px;margin:18px 0 0;font-family:var(--sans);font-size:13.5px;border-top:3px solid var(--ink)}
.C .compare .k{color:var(--stone);text-align:center;font-size:12px;align-self:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.C .compare .l,.C .compare .r{padding:8px 0;border-bottom:1px solid var(--rule);font-weight:500}
.C .compare .r{text-align:right}
.C .compare .hd{font-family:var(--serif);font-size:20px;font-weight:600;padding:10px 0 6px;border-bottom:1px solid var(--ink)}
.C .compare .hd.r{color:var(--gold-deep)}
.C .wrap{display:grid;grid-template-columns:1fr;gap:0 28px;max-width:60em;margin:0 auto;padding:0 16px 60px}
.C article{max-width:38em}
.C section{padding:22px 0 4px}
.C h2{font-size:24px;font-weight:600;font-variation-settings:"opsz" 48;margin-bottom:8px}
.C h2::before{content:"";display:block;width:36px;height:5px;background:var(--gold);margin-bottom:10px}
.C .lede{font-size:18px;line-height:1.4}
.C details{font-family:var(--sans);font-size:12px;color:var(--stone);margin:.5em 0 0}
.C summary{cursor:pointer;color:var(--gold-deep)}
.C details a{color:inherit}
.C .table-wrap td,.C .table-wrap th{padding:4px 6px}
.C .venue-flag{margin:12px 0 0}
@media (min-width:860px){
  .C .wrap{grid-template-columns:1fr 240px}
  .C aside.sources{font-family:var(--sans);font-size:12px;color:var(--stone);padding-top:30px;line-height:1.45}
  .C aside.sources h3{font-size:12px;color:var(--ink);margin:0 0 6px;font-family:var(--sans)}
  .C aside.sources p{margin:0 0 10px}
  .C details{display:none}
}
@media (min-width:860px){.A .players{grid-template-columns:1fr 1fr 1fr}}

/* ---------- switcher (not part of the design) ---------- */
#proto-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#1b1b1b;color:#fff;border-radius:999px;padding:6px 8px;display:flex;gap:6px;align-items:center;font:13px/1 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:99;max-width:96vw}
#proto-bar button{background:#333;color:#fff;border:0;border-radius:999px;padding:7px 11px;font:inherit;cursor:pointer}
#proto-bar button[aria-pressed=true]{background:var(--gold);color:#000}
#proto-bar .lbl{padding:0 6px;white-space:nowrap}

/* ---------- print / A5 ---------- */
@page{size:A5;margin:11mm 12mm}
@media print{
  body{font-size:11pt}
  #proto-bar{display:none}
  .A .cover{min-height:auto;height:calc(210mm - 22mm);break-after:page;padding:0}
  .A .body,.B .body,.C .wrap{max-width:none;padding:0}
  .A .cover .title{font-size:52pt}
  .A h2{font-size:20pt;break-after:avoid}
  .C .hero{padding:0}
  .C .hero h1{font-size:34pt}
  .C .wrap{display:block}
  .C aside.sources{display:none}
  .C details{display:block}
  .C details summary{list-style:none}
  .C details[open] summary{display:none}
  .A .players,.B .facts{break-inside:avoid}
  h3{break-after:avoid}
  section{break-inside:auto}
  tr{break-inside:avoid}
  a{text-decoration:none}
  .B .top,.B .facts{break-inside:avoid}
  .B .facts{grid-template-columns:repeat(4,1fr)}
  .B .facts strong{font-size:15pt}
}
</style>
</head>
<body>

<script>
// ------------------------------------------------------------------ content
const S = {
  clubReportCluj: ['Club report, 21 Oct', 'https://www.thelondonlions.com/news/lions-dominate-second-half-to-beat-cluj-89-72-on-the-road'],

};
const params = new URLSearchParams(location.search);
const VENUE_CHANGED = params.get('venue') === 'changed';
const fixture = {

  venue: VENUE_CHANGED ? 'New City College, Hackney' : 'Copper Box Arena',
  address: VENUE_CHANGED ? 'Falkirk Street, London N1 6HQ' : 'Queen Elizabeth Olympic Park, London E20 3HB',
};
const lionsResults = [
  ['Wed 21 Oct', 'EuroCup', 'at U-BT Cluj-Napoca', 'W 89–72'],
  ['Sun 18 Oct', 'SLB', 'at Cheshire Phoenix', 'W 87–83'],
  ['Thu 15 Oct', 'EuroCup', 'v Skyliners Frankfurt', 'L 76–81'],
  ['Tue 6 Oct', 'EuroCup', 'v La Laguna Tenerife', 'W 89–77'],
  ['Fri 2 Oct', 'SLB', 'v Leicester Riders', 'W 71–66'],
  ['Wed 30 Sep', 'EuroCup', 'at Siauliai', 'L 71–74'],
  ['Sun 27 Sep', 'SLB', 'v Liverpool Basketball', 'W 78–49'],

];

  ['Sun 18 Oct', 'SLB', 'v Liverpool Basketball', 'W 90–89'],
  ['Mid-Oct', 'ENBL', 'at Syntainics MBC (Germany)', 'L 84–106'],
  ['Fri 9 Oct', 'SLB', 'at Leicester Riders', 'W 78–73'],
  ['Fri 2 Oct', 'SLB', 'v Manchester Basketball', 'W 76–58'],
  ['Fri 25 Sep', 'SLB', 'at Newcastle Eagles', 'L 68–94'],
  ['Sun 20 Sep', 'SLB', 'at Cheshire Phoenix', 'W 101–92'],
  ['Fri 18 Sep', 'SLB', 'v London Lions', 'L 78–80'],
];
const table = [
  ['London Lions',6,6,0,12],['Bristol Flyers',6,4,2,8],['Caledonia Gladiators',5,3,2,6],['Newcastle Eagles',5,3,2,6],
  ['B. Braun Sheffield Sharks',4,2,2,4],['Cheshire Phoenix',5,2,3,4],['Liverpool Basketball',5,2,3,4],['Manchester Basketball',6,2,4,4],
  ['Surrey 89ers',3,1,2,2],['Leicester Riders',5,0,5,0],
];
const lionsRoster = [
  [1,'Joel Scott','C/F'],[2,'Maxwell Lewis III','F'],[3,'Devante Jones','G'],[5,'Ade Adebayo','F'],[6,'Morayo Soluade','F'],[7,'Joshua O’Garro','F'],
  [8,'Emilis Zibuda','F'],[10,'Ethan Price','C/F'],[12,'Keenan Evans','G'],[21,'Aaryn Rai','F'],[22,'Tarik Phillip','G'],[23,'Landrius Horton','F/G'],
  [31,'Deane Williams','C/F'],[54,'Thomas Kennedy','C'],
];
const bristolRoster = [
  [0,'Cameron Holden','G'],[1,'Zac Triplett','G'],[2,'Michael Diggins Jr','F'],[4,'Matteus Case','G'],[5,'Davion Bailey','G'],[9,'Dylan Wilkie','G'],
  [10,'Zachary Anderson','F'],[13,'Kasen Jennings','G'],[21,'Marcus Delpeche','C/F'],[22,'Malcolm Delpeche','C'],[24,'Imam Toure','F'],[25,'Milos Dugalic','F'],[99,'Nojus Zajankauskas','G'],

// ------------------------------------------------------------------ helpers
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

// ------------------------------------------------------------------ Variant A: Programme
function VariantA(){
  return `<div class="A">

    <div class="date">${fixture.day}, ${fixture.comp}</div>

    ${resultsHtml(lionsResults)}
    ${srcLine(['clubReportCluj','clubReportCheshire','gsSchedule','elApi'])}
  </section>
  <section>
    <h2>Lions roster <i>and who to watch</i></h2>
    <div class="players">${lionsKey.map(k => `<div><b>${esc(k[0])}</b><small>${esc(k[1])}</small><br>${esc(k[2])}</div>`).join('')}</div>
    <h3>Full roster</h3>
    ${rosterHtml(lionsRoster)}
    ${srcLine(['gsLionsStats','gsLionsRoster','clubReportCluj','clubReportCheshire','clubReportBristol'])}
  </section>

// ------------------------------------------------------------------ switcher
const variants = { A: ['Programme', VariantA], B: ['Briefing', VariantB], C: ['Head to head', VariantC] };
const keys = Object.keys(variants);
let current = keys.includes(params.get('variant')) ? params.get('variant') : 'A';
function render(){
  document.getElementById('root').innerHTML = variants[current][1]();
  document.title = `Lions v Flyers programme, ${variants[current][0]}`;
  const bar = document.getElementById('proto-bar');
  bar.innerHTML = `<button id="prev" aria-label="Previous variant">&larr;</button><span class="lbl">${current} (${variants[current][0]})</span><button id="next" aria-label="Next variant">&rarr;</button><button id="venue" aria-pressed="${VENUE_CHANGED}">Venue change</button>`;
  bar.querySelector('#prev').onclick = () => go(-1);
  bar.querySelector('#next').onclick = () => go(1);
  bar.querySelector('#venue').onclick = () => { const p = new URLSearchParams(location.search); VENUE_CHANGED ? p.delete('venue') : p.set('venue','changed'); location.search = p.toString(); };
  window.scrollTo(0,0);
}
function go(d){ current = keys[(keys.indexOf(current)+d+keys.length)%keys.length]; const p = new URLSearchParams(location.search); p.set('variant', current); history.replaceState(null,'','?'+p.toString()); render(); }
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key==='ArrowLeft') go(-1); if (e.key==='ArrowRight') go(1); });
render();
</script>
