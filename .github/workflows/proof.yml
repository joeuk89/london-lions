name: Prove unattended runs

# Throwaway: delete this workflow and pages-proof.txt once both proofs pass.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-output
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: All four secrets are set
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          missing=0
          for name in CLAUDE_CODE_OAUTH_TOKEN GMAIL_USER GMAIL_APP_PASSWORD MAIL_TO; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          exit $missing

  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Push a marker with GITHUB_TOKEN
        id: marker
        run: |
          marker="proof-${{ github.run_id }}-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "$marker" > pages-proof.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-proof.txt
          git commit -m "Pages proof: $marker"
          git pull --rebase
          git push
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages to serve the marker
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pages-proof.txt"
          for i in $(seq 1 60); do
            if curl -fsS "$url?nocache=$i" | grep -qx "${{ steps.marker.outputs.marker }}"; then
              echo "Pages served the marker from $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages did not serve the marker within 10 minutes; the GITHUB_TOKEN push may not trigger a Pages build"
          exit 1

  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Send a test email over port 465
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          node --input-type=module -e "
            import nodemailer from 'nodemailer';
            const { GMAIL_USER, GMAIL_APP_PASSWORD, MAIL_TO } = process.env;
            const transport = nodemailer.createTransport({
              host: 'smtp.gmail.com', port: 465, secure: true,
              auth: { user: GMAIL_USER, pass: GMAIL_APP_PASSWORD },
            });
            const result = await transport.sendMail({
              from: \`London Lions fixtures <\${GMAIL_USER}>\`,
              to: MAIL_TO.split(',').map((s) => s.trim()).filter(Boolean),
              subject: 'London Lions: Actions email proof (run ${{ github.run_id }})',
              text: 'If this reached your inbox, Gmail SMTP on port 465 works from GitHub Actions.',
            });
            console.log('Sent', result.messageId);
          "
